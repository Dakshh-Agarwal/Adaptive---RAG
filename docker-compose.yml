version: "3.9"

services:

  # ─── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: adaptive_rag_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ─── Node.js Auth BFF ─────────────────────────────────────────
  bff:
    build:
      context: ./Agentic-BFF-Node
      dockerfile: Dockerfile
    container_name: adaptive_rag_bff
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - JWT_SECRET=super_secret_jwt_key
    restart: unless-stopped

  # ─── Python FastAPI RAG Backend ────────────────────────────────
  fastapi:
    build:
      context: ./Adaptive-Rag
      dockerfile: Dockerfile
    container_name: adaptive_rag_fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./Adaptive-Rag/.env
    environment:
      # Override localhost MongoDB URL to use Docker service name
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    restart: unless-stopped

  # ─── Streamlit Frontend ────────────────────────────────────────
  streamlit:
    build:
      context: ./Adaptive-Rag
      dockerfile: Dockerfile.streamlit
    container_name: adaptive_rag_streamlit
    ports:
      - "8501:8501"
    env_file:
      - ./Adaptive-Rag/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
      - fastapi
      - bff
    restart: unless-stopped

volumes:
  mongo_data:
